# 扩大编译期容量，将有限核默认网格点数固定为 590。
# 复制为脚本同目录的 config.toml。脚本修改该 Suite 副本的 src/。
RUN_MODE = "preview"  # preview / apply / check
PRINT_DIFF = true
CAPACITY_ONLY = true

# BACKUP_DIRECTORY = "/path/to/new-backup"
# RESTORE_DIRECTORY = "/path/to/saved-backup"

[GRID_PARAMETERS]
nnnp = 1990  # max_radial_points，工作区容量自动派生为 2000
n = 590  # 固定有限核默认点数
# 本模式必须提供 nnnp 和 n，且不允许任何其他 GRID_PARAMETERS 项。
