# 复制为脚本同目录的 config.toml。脚本修改该 Suite 副本的 src/。
# 备份和恢复的相对路径以配置文件所在目录为准。
RUN_MODE = "preview"  # preview / apply / check
PRINT_DIFF = true

# 可选路径应放在 [GRID_PARAMETERS] 之前；省略即采用默认行为。
# BACKUP_DIRECTORY = "/path/to/new-backup"  # 省略：不生成备份
# RESTORE_DIRECTORY = "/path/to/saved-backup"  # 省略：正常修改；设置后进入恢复

[GRID_PARAMETERS]
nnnp = 3990  # 编译期容量 max_radial_points，工作区容量自动派生为 4000
n = 2946  # 有限核默认网格点数
h = 0.010
rnt_scale = 2e-6  # radial_grid_scale = 此值 / nuclear_charge
hp = 0.0
accy = 1e-10

# TOML 没有 None；省略以下参数表示不修改点核默认值。
# point_n = 220
# point_h = 0.0625
# point_rnt_scale = 0.017205950425851383
